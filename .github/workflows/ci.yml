name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: bun.lock без непубличных реестров
        run: "! grep -qE 'https?://' bun.lock"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: guidelines-render:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/cache@v4
        with:
          path: .eraser/icons
          key: icons-${{ hashFiles('rk*/diagrams/*.json') }}
          restore-keys: |
            icons-
      - run: >-
          docker run --rm -v "$PWD:/work" -w /work guidelines-render:ci
          bash -c "bun install --frozen-lockfile && bun run typecheck && bun run test && bun run validate
          && bun run check && bun run warm && bun run fresh && bun run links && bun run mermaid:native
          && bun run ext:build && bun run ext:zip && node --version && bun run site:build && bun run site:check"
      - name: Права на собранный сайт
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo chown -R "$(id -u)" .vitepress/dist public
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .vitepress/dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cookie-viewer
          path: public/cookie-viewer.zip
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@v4
        with:
          name: cookie-viewer
          path: public
      - run: bun scripts/release-extension.ts public/cookie-viewer.zip
        env:
          GH_TOKEN: ${{ github.token }}
